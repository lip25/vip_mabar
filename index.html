<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Mabar Rhea</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:94%;
    max-width:700px;
    margin:auto;
    padding-bottom:40px;
}

header{
    padding:25px 0;
}

h1{
    margin:0;
    font-size:20px;
}

.subtitle{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.card,
.queue-card,
.participant{
    background:#11131a;
    border:1px solid #292d38;
    border-radius:15px;
    padding:15px;
}

.card{
    margin-bottom:12px;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #292d38;
    background:#08090d;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#8b5cf6;
}

/* STATISTIK */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    background:#11131a;
    border:1px solid #292d38;
    border-radius:14px;
    padding:13px 8px;
}

.stat-title{
    color:#777;
    font-size:9px;
}

.stat-value{
    font-size:18px;
    font-weight:bold;
    margin-top:5px;
}

/* TOMBOL TAMBAH */

.add-main{
    width:100%;
    display:block;
    border:0;
    border-radius:13px;
    padding:14px;
    background:#7c3aed;
    color:#fff;
    font-weight:bold;
    font-size:13px;
    margin-bottom:12px;
    cursor:pointer;
}

.add-main:active{
    transform:scale(.98);
}

/* FORM */

.form{
    display:none;
}

.form.show{
    display:block;
}

.form-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.form-title h2{
    margin:0;
    font-size:15px;
}

.close{
    width:32px;
    height:32px;
    border:1px solid #333;
    border-radius:8px;
    background:#181b24;
    color:#aaa;
    font-size:18px;
    cursor:pointer;
}

.field{
    margin-bottom:12px;
}

.preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:12px;
}

.preview-box{
    background:#18131f;
    border:1px solid #35264d;
    border-radius:10px;
    padding:11px;
}

.preview-label{
    color:#888;
    font-size:9px;
}

.preview-value{
    color:#c4b5fd;
    font-weight:bold;
    margin-top:4px;
}

.form-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.save,
.cancel{
    border-radius:10px;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    border:0;
    background:#7c3aed;
    color:#fff;
}

.cancel{
    border:1px solid #292d38;
    background:#181b24;
    color:#aaa;
}

/* ANTRIAN */

.queue-card{
    margin-top:18px;
}

.queue-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.queue-title{
    font-size:14px;
    font-weight:bold;
}

.queue-count{
    color:#888;
    font-size:10px;
}

.copy-queue{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:#21182e;
    border:1px solid #49356d;
    color:#c4b5fd;
    font-size:11px;
    font-weight:bold;
    margin-bottom:12px;
    cursor:pointer;
}

.queue-preview{
    background:#08090d;
    border:1px solid #292d38;
    border-radius:10px;
    padding:12px;
    color:#bbb;
    font-size:11px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
}

.queue-empty{
    color:#666;
    text-align:center;
}

/* DAFTAR */

.section{
    margin-top:18px;
    margin-bottom:10px;
    font-size:14px;
    font-weight:bold;
}

.participant{
    margin-bottom:9px;
}

.participant.done{
    opacity:.5;
}

.participant-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.name{
    font-size:14px;
    font-weight:bold;
}

.ml-id{
    color:#888;
    font-size:10px;
    margin-top:4px;
}

.donate{
    color:#bfa7ff;
    font-size:11px;
    margin-top:8px;
}

.games{
    text-align:right;
}

.game-number{
    font-size:25px;
    font-weight:bold;
}

.game-label{
    color:#777;
    font-size:9px;
}

.done-text{
    color:#4ade80;
    font-size:10px;
    font-weight:bold;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-top:13px;
}

.control{
    padding:9px 5px;
    border-radius:8px;
    border:1px solid #292d38;
    background:#181b24;
    color:#ddd;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.minus{
    color:#fca5a5;
}

.plus{
    color:#86efac;
}

.delete{
    color:#fca5a5;
}

.reset{
    width:100%;
    margin-top:15px;
    padding:11px;
    background:none;
    border:1px solid #292d38;
    border-radius:10px;
    color:#666;
    font-size:10px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:30px;
    border:1px dashed #292d38;
    border-radius:15px;
    color:#666;
    font-size:12px;
}

@media(max-width:500px){

    .stats{
        gap:5px;
    }

    .stat-value{
        font-size:16px;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .delete{
        grid-column:1/3;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>⚡ VIP Mabar Rhea</h1>
    <div class="subtitle">Dashboard Peserta</div>
</header>

<!-- HARGA -->

<div class="card">

    <label>HARGA VIP PER GAME</label>

    <input
        type="number"
        id="hargaVIP"
        value="5000"
        min="1"
    >

</div>

<!-- STATISTIK -->

<div class="stats">

    <div class="stat">
        <div class="stat-title">PESERTA</div>
        <div class="stat-value" id="jumlahPeserta">0</div>
    </div>

    <div class="stat">
        <div class="stat-title">GAME TERSISA</div>
        <div class="stat-value" id="jumlahGame">0</div>
    </div>

    <div class="stat">
        <div class="stat-title">TOTAL DONATE</div>
        <div class="stat-value" id="totalDonate">Rp0</div>
    </div>

</div>

<!-- TOMBOL TAMBAH -->

<button
    type="button"
    class="add-main"
    id="btnTambah"
>
    + TAMBAH PESERTA
</button>

<!-- FORM -->

<div
    class="card form"
    id="formPeserta"
>

    <div class="form-title">

        <h2>Tambah Peserta</h2>

        <button
            type="button"
            class="close"
            id="btnClose"
        >
            ×
        </button>

    </div>

    <div class="field">

        <label>NAMA / ID DONATE</label>

        <input
            type="text"
            id="nama"
            placeholder="Contoh: Alif"
        >

    </div>

    <div class="field">

        <label>ID MOBILE LEGENDS</label>

        <input
            type="text"
            id="mlid"
            placeholder="Opsional"
        >

    </div>

    <div class="field">

        <label>JUMLAH DONATE</label>

        <input
            type="number"
            id="donate"
            placeholder="Contoh: 25000"
            min="1"
        >

    </div>

    <div class="preview">

        <div class="preview-box">

            <div class="preview-label">
                DONATE
            </div>

            <div
                class="preview-value"
                id="previewDonate"
            >
                Rp0
            </div>

        </div>

        <div class="preview-box">

            <div class="preview-label">
                MENDAPAT
            </div>

            <div
                class="preview-value"
                id="previewGame"
            >
                0 Game
            </div>

        </div>

    </div>

    <div class="form-buttons">

        <button
            type="button"
            class="cancel"
            id="btnCancel"
        >
            BATAL
        </button>

        <button
            type="button"
            class="save"
            id="btnSave"
        >
            TAMBAH
        </button>

    </div>

</div>

<!-- ANTRIAN -->

<div class="queue-card">

    <div class="queue-header">

        <div class="queue-title">
            🎮 ANTRIAN PEMAIN
        </div>

        <div
            class="queue-count"
            id="jumlahAntrian"
        >
            0 pemain
        </div>

    </div>

    <button
        type="button"
        class="copy-queue"
        id="btnCopy"
    >
        📋 SALIN ANTRIAN
    </button>

    <div
        class="queue-preview"
        id="previewAntrian"
    >
        <div class="queue-empty">
            Belum ada pemain dalam antrian.
        </div>
    </div>

</div>

<!-- DAFTAR PESERTA -->

<div class="section">
    DAFTAR PESERTA
</div>

<div id="daftarPeserta">

    <div class="empty">
        Belum ada peserta.
    </div>

</div>

<button
    type="button"
    class="reset"
    id="btnReset"
>
    RESET SEMUA DATA
</button>

</div>

<script>

var peserta = [];
var hargaVIP = 5000;


/* ELEMENT */

var hargaInput =
    document.getElementById("hargaVIP");

var btnTambah =
    document.getElementById("btnTambah");

var btnClose =
    document.getElementById("btnClose");

var btnCancel =
    document.getElementById("btnCancel");

var btnSave =
    document.getElementById("btnSave");

var btnCopy =
    document.getElementById("btnCopy");

var btnReset =
    document.getElementById("btnReset");

var formPeserta =
    document.getElementById("formPeserta");

var namaInput =
    document.getElementById("nama");

var mlidInput =
    document.getElementById("mlid");

var donateInput =
    document.getElementById("donate");

var previewDonate =
    document.getElementById("previewDonate");

var previewGame =
    document.getElementById("previewGame");

var daftarPeserta =
    document.getElementById("daftarPeserta");


/* RUPIAH */

function rupiah(angka){

    angka = Number(angka) || 0;

    return "Rp" +
        angka.toLocaleString("id-ID");

}


/* SIMPAN */

function simpan(){

    try{

        localStorage.setItem(
            "vipPeserta",
            JSON.stringify(peserta)
        );

        localStorage.setItem(
            "vipHarga",
            String(hargaVIP)
        );

    }catch(error){

        console.log(
            "Gagal menyimpan:",
            error
        );

    }

}


/* LOAD */

function loadData(){

    try{

        var data =
            localStorage.getItem(
                "vipPeserta"
            );

        if(data){

            var parsed =
                JSON.parse(data);

            if(
                Array.isArray(parsed)
            ){

                peserta = parsed;

            }

        }


        var harga =
            Number(
                localStorage.getItem(
                    "vipHarga"
                )
            );


        if(
            Number.isFinite(harga) &&
            harga > 0
        ){

            hargaVIP = harga;

        }

    }catch(error){

        peserta = [];
        hargaVIP = 5000;

    }


    hargaInput.value =
        hargaVIP;

}


/* BUKA FORM */

function bukaForm(){

    formPeserta.classList.add(
        "show"
    );

    namaInput.focus();

}


/* TUTUP FORM */

function tutupForm(){

    formPeserta.classList.remove(
        "show"
    );

    namaInput.value = "";
    mlidInput.value = "";
    donateInput.value = "";

    hitungPreview();

}


/* PREVIEW */

function hitungPreview(){

    var donate =
        Number(
            donateInput.value
        ) || 0;


    var harga =
        Number(
            hargaInput.value
        ) || 5000;


    var game = 0;


    if(
        donate > 0 &&
        harga > 0
    ){

        game =
            Math.floor(
                donate / harga
            );

    }


    previewDonate.innerText =
        rupiah(donate);


    previewGame.innerText =
        game + " Game";

}


/* TAMBAH PESERTA */

function tambahPeserta(){

    var nama =
        namaInput.value.trim();


    var mlid =
        mlidInput.value.trim();


    var donate =
        Number(
            donateInput.value
        );


    var harga =
        Number(
            hargaInput.value
        );


    if(!nama){

        alert(
            "Masukkan nama atau ID donate."
        );

        namaInput.focus();

        return;

    }


    if(
        !Number.isFinite(donate) ||
        donate <= 0
    ){

        alert(
            "Masukkan jumlah donate."
        );

        donateInput.focus();

        return;

    }


    if(
        !Number.isFinite(harga) ||
        harga <= 0
    ){

        alert(
            "Harga VIP tidak valid."
        );

        return;

    }


    var game =
        Math.floor(
            donate / harga
        );


    if(game < 1){

        alert(
            "Donate belum cukup untuk 1 game."
        );

        return;

    }


    var baru = {

        id:
            String(Date.now()) +
            String(Math.random()),

        nama:
            nama,

        mlid:
            mlid || "-",

        donate:
            donate,

        game:
            game

    };


    peserta.push(baru);

    hargaVIP = harga;

    simpan();

    tampilkan();

    tampilkanAntrian();

    tutupForm();

}


/* TAMPILKAN */

function tampilkan(){

    var jumlahGame = 0;
    var totalDonate = 0;


    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        jumlahGame +=
            Number(
                peserta[i].game
            ) || 0;


        totalDonate +=
            Number(
                peserta[i].donate
            ) || 0;

    }


    document.getElementById(
        "jumlahPeserta"
    ).innerText =
        peserta.length;


    document.getElementById(
        "jumlahGame"
    ).innerText =
        jumlahGame;


    document.getElementById(
        "totalDonate"
    ).innerText =
        rupiah(totalDonate);


    if(
        peserta.length === 0
    ){

        daftarPeserta.innerHTML =
            '<div class="empty">' +
            'Belum ada peserta.' +
            '</div>';

        return;

    }


    var html = "";


    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        var p =
            peserta[i];


        var game =
            Number(p.game) || 0;


        var selesai =
            game <= 0;


        html +=
        '<div class="participant ' +
        (
            selesai
            ? "done"
            : ""
        ) +
        '">' +

            '<div class="participant-top">' +

                '<div>' +

                    '<div class="name">' +
                        aman(p.nama) +
                    '</div>' +

                    '<div class="ml-id">' +
                        'ID ML: ' +
                        aman(p.mlid) +
                    '</div>' +

                    '<div class="donate">' +
                        'Donate: <strong>' +
                        rupiah(p.donate) +
                        '</strong>' +
                    '</div>' +

                '</div>' +

                '<div class="games">' +

                    (
                        selesai

                        ?

                        '<div class="done-text">' +
                            '✓ SELESAI' +
                        '</div>'

                        :

                        '<div>' +

                            '<div class="game-number">' +
                                game +
                            '</div>' +

                            '<div class="game-label">' +
                                'GAME TERSISA' +
                            '</div>' +

                        '</div>'
                    ) +

                '</div>' +

            '</div>' +

            '<div class="controls">' +

                '<button ' +
                    'type="button" ' +
                    'class="control minus" ' +
                    'data-action="minus" ' +
                    'data-id="' +
                        aman(p.id) +
                    '"' +
                    (
                        selesai
                        ? ' disabled'
                        : ''
                    ) +
                '>' +
                    '− 1 GAME' +
                '</button>' +

                '<button ' +
                    'type="button" ' +
                    'class="control plus" ' +
                    'data-action="plus" ' +
                    'data-id="' +
                        aman(p.id) +
                    '"' +
                '>' +
                    '+ 1 GAME' +
                '</button>' +

                '<button ' +
                    'type="button" ' +
                    'class="control delete" ' +
                    'data-action="delete" ' +
                    'data-id="' +
                        aman(p.id) +
                    '"' +
                '>' +
                    'HAPUS' +
                '</button>' +

            '</div>' +

        '</div>';

    }


    daftarPeserta.innerHTML =
        html;

}


/* PESERTA AKTIF */

function getAktif(){

    var aktif = [];


    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        if(
            Number(
                peserta[i].game
            ) > 0
        ){

            aktif.push(
                peserta[i]
            );

        }

    }


    return aktif;

}


/* =================================
   TEKS CLIPBOARD

   HANYA:
   NAMA | JUMLAH GAME

   TIDAK ADA:
   - JUDUL
   - NOMOR
   - EMOJI
   - DONATE
================================= */

function buatTextAntrian(){

    var aktif =
        getAktif();


    if(
        aktif.length === 0
    ){

        return "";

    }


    var text = "";


    for(
        var i = 0;
        i < aktif.length;
        i++
    ){

        var p =
            aktif[i];


        text +=
            p.nama +
            " | " +
            p.game +
            " Game";


        if(
            i <
            aktif.length - 1
        ){

            text += "\n";

        }

    }


    return text;

}


/* TAMPILKAN ANTRIAN */

function tampilkanAntrian(){

    var aktif =
        getAktif();


    document.getElementById(
        "jumlahAntrian"
    ).innerText =
        aktif.length +
        " pemain";


    var preview =
        document.getElementById(
            "previewAntrian"
        );


    if(
        aktif.length === 0
    ){

        preview.innerHTML =
            '<div class="queue-empty">' +
            'Belum ada pemain dalam antrian.' +
            '</div>';

        return;

    }


    preview.textContent =
        buatTextAntrian();

}


/* KURANGI GAME */

function kurangiGame(id){

    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        if(
            String(
                peserta[i].id
            ) ===
            String(id)
        ){

            if(
                Number(
                    peserta[i].game
                ) > 0
            ){

                peserta[i].game--;

                if(
                    peserta[i].game < 0
                ){

                    peserta[i].game = 0;

                }


                simpan();

                tampilkan();

                tampilkanAntrian();

            }

            return;

        }

    }

}


/* TAMBAH GAME */

function tambahGame(id){

    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        if(
            String(
                peserta[i].id
            ) ===
            String(id)
        ){

            peserta[i].game =
                Number(
                    peserta[i].game
                ) + 1;


            simpan();

            tampilkan();

            tampilkanAntrian();

            return;

        }

    }

}


/* HAPUS */

function hapusPeserta(id){

    if(
        !confirm(
            "Hapus peserta ini?"
        )
    ){

        return;

    }


    var hasil = [];


    for(
        var i = 0;
        i < peserta.length;
        i++
    ){

        if(
            String(
                peserta[i].id
            ) !==
            String(id)
        ){

            hasil.push(
                peserta[i]
            );

        }

    }


    peserta = hasil;

    simpan();

    tampilkan();

    tampilkanAntrian();

}


/* RESET */

function resetData(){

    if(
        peserta.length === 0
    ){

        return;

    }


    if(
        !confirm(
            "Yakin ingin menghapus SEMUA peserta?"
        )
    ){

        return;

    }


    peserta = [];

    simpan();

    tampilkan();

    tampilkanAntrian();

}


/* COPY MANUAL */

function salinManual(text){

    var area =
        document.createElement(
            "textarea"
        );


    area.value =
        text;


    area.style.position =
        "fixed";


    area.style.left =
        "-9999px";


    document.body.appendChild(
        area
    );


    area.focus();

    area.select();


    try{

        document.execCommand(
            "copy"
        );

        alert(
            "Antrian berhasil disalin."
        );

    }catch(error){

        alert(
            "Gagal menyalin."
        );

    }


    document.body.removeChild(
        area
    );

}


/* COPY */

function salinAntrian(){

    var text =
        buatTextAntrian();


    if(!text){

        alert(
            "Belum ada pemain dalam antrian."
        );

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(function(){

                alert(
                    "Antrian berhasil disalin."
                );

            })
            .catch(function(){

                salinManual(text);

            });

    }else{

        salinManual(text);

    }

}


/* AMANKAN HTML */

function aman(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* EVENT TOMBOL PESERTA */

daftarPeserta.addEventListener(
    "click",
    function(event){

        var tombol =
            event.target.closest(
                "button[data-action]"
            );


        if(!tombol){

            return;

        }


        var action =
            tombol.getAttribute(
                "data-action"
            );


        var id =
            tombol.getAttribute(
                "data-id"
            );


        if(
            action === "minus"
        ){

            kurangiGame(id);

        }


        if(
            action === "plus"
        ){

            tambahGame(id);

        }


        if(
            action === "delete"
        ){

            hapusPeserta(id);

        }

    }
);
